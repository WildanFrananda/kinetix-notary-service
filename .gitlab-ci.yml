include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  GOTOOLCHAIN: local
  KINETIX_NOTARY_TEST_RPC_URL: http://127.0.0.1:8545
  KINETIX_NOTARY_TEST_DATABASE_URL: postgres://notary_test@postgres:5432/notary_test?sslmode=disable

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

verify-contracts:
  image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  stage: test
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-venv xz-utils
    - sh bin/install-toolchain /usr/local/bin foundry analysis
    - sh bin/ci-contracts
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-go:
  image: golang:1.26-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  stage: test
  services:
    - name: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
      alias: postgres
      variables:
        POSTGRES_USER: notary_test
        POSTGRES_DB: notary_test
        POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip
    - sh bin/install-toolchain /usr/local/bin foundry abigen protobuf sqlc lint bun
    - anvil --host 127.0.0.1 --port 8545 --chain-id 31337 > anvil.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        if cast chain-id --rpc-url "$KINETIX_NOTARY_TEST_RPC_URL" >/dev/null 2>&1; then
          echo "anvil answered after ${i}s"; break
        fi
        sleep 1
        if [ "$i" = "30" ]; then cat anvil.log; exit 1; fi
      done
    - sh bin/ci-go
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
