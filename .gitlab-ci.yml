include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

variables:
  GOTOOLCHAIN: local
  KINETIX_NOTARY_TEST_RPC_URL: http://127.0.0.1:8545

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

verify:
  image: golang:1.26-bookworm@sha256:a688600ca24f8a4d3ca77f95b0dd40704a9fc787c826660eb7ba0b641b8b175d
  stage: test
  script:
    - sh bin/install-toolchain /usr/local/bin
    - anvil --host 127.0.0.1 --port 8545 --chain-id 31337 > anvil.log 2>&1 &
    - |
      for i in $(seq 1 30); do
        if cast chain-id --rpc-url "$KINETIX_NOTARY_TEST_RPC_URL" >/dev/null 2>&1; then
          echo "anvil answered after ${i}s"; break
        fi
        sleep 1
        if [ "$i" = "30" ]; then cat anvil.log; exit 1; fi
      done
    - sh bin/ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
