name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.26"
  KINETIX_NOTARY_TEST_RPC_URL: http://127.0.0.1:8545

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install the pinned toolchain
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sh bin/install-toolchain "$HOME/.local/bin"
      - name: Start a node
        run: |
          "$HOME/.local/bin/anvil" --host 127.0.0.1 --port 8545 --chain-id 31337 > "$RUNNER_TEMP/anvil.log" 2>&1 &
          for i in $(seq 1 30); do
            if "$HOME/.local/bin/cast" chain-id --rpc-url "$KINETIX_NOTARY_TEST_RPC_URL" >/dev/null 2>&1; then
              echo "anvil answered after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/anvil.log"
          exit 1
      - run: sh bin/ci
