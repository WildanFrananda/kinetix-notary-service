version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - ineffassign
    - unconvert
    - unparam
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - nilerr
    - wrapcheck
    - wsl_v5

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - .Errf(
        - .Wrap(
        - .RecvMsg(
        - status.Error(
      ignore-package-globs:
        - github.com/WildanFrananda/kinetix-notary-service/*

  exclusions:
    paths:
      - contracts/
      - internal/contractgen/
    rules:
      - path: tests/
        linters: [gosec, unparam, wrapcheck]

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    golines:
      max-len: 120
      shorten-comments: false
      reformat-tags: false
    goimports:
      local-prefixes:
        - github.com/WildanFrananda/kinetix-notary-service
