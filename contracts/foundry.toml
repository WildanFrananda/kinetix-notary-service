[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "cancun"
auto_detect_solc = false
optimizer = true
optimizer_runs = 10000
bytecode_hash = "none"
cbor_metadata = false
deny = "warnings"
always_use_create_2_factory = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[profile.default.fuzz]
runs = 1024
seed = "0x4b494e45544958"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 20000

[profile.ci.invariant]
runs = 1024
depth = 128

[lint]
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
multiline_func_header = "params_first_multi"
prefer_compact = "none"
ignore = ["src/**/*.sol"]
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
sort_imports = true

[soldeer]
remappings_generate = true
remappings_regenerate = true
remappings_version = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
forge-std = "1.16.2"
