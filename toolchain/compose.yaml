name: kinetix-notary-toolchain

x-toolchain-image: &toolchain-image
  build:
    context: ..
    dockerfile: toolchain/Dockerfile
  image: kinetix-notary-toolchain:local

services:
  anvil:
    <<: *toolchain-image
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 2s
      timeout: 2s
      retries: 15

  toolchain:
    <<: *toolchain-image
    working_dir: /workspace
    environment:
      KINETIX_NOTARY_TEST_RPC_URL: http://anvil:8545
    volumes:
      - ..:/workspace
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - svm:/root/.svm
      - foundry-home:/root/.foundry
    depends_on:
      anvil:
        condition: service_healthy

volumes:
  go-mod:
  go-build:
  svm:
  foundry-home:
